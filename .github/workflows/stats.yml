name: Generate GitHub Stats
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate Stats Images
        run: |
          curl -s "https://github-readme-stats.vercel.app/api?username=Yoriyoi07&show_icons=true&theme=tokyonight" > github-stats.svg
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=Yoriyoi07&layout=compact&theme=tokyonight" > top-langs.svg
          
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-langs.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Update GitHub stats"
          git push
